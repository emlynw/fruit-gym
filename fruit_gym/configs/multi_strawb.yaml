domain_randomization:
  lighting:
    enabled: true
    position_range_low: [-0.8, -0.5, -0.05]
    position_range_high: [1.2, 0.5, 0.2]
    diffuse_range:
      low: [0.05, 0.05, 0.05]
      high: [0.3, 0.3, 0.3]
    ambient_range:
      low: [0.0, 0.0, 0.0]
      high: [0.2, 0.2, 0.2]
    specular_range:
      low: [0.0, 0.0, 0.0]
      high: [0.5, 0.5, 0.5]
    intensity_range: [0.1, 1.0]

  action_scale:
    enabled: true
    pos_scale_range: [0.008, 0.012]
    rot_scale_range: [0.18, 0.3]

  robot_pose:
    enabled: true
    position_range_low: [-0.04, -0.05, 0.00]
    position_range_high: [0.04, 0.05, 0.10]
    rotation_enabled: true
    angle_range: [-0.5, 0.5]
    yaw_only: false

  cameras:
    enabled: true
    front:
      position_noise_low: [-0.05, -0.05, -0.02]
      position_noise_high: [0.05, 0.05, 0.02]
      quat_noise_range: [-0.02, 0.02]
    wrist1:
      quat_noise_range: [-0.02, 0.02]
    wrist2:
      quat_noise_range: [-0.02, 0.02]


  floor:
    enabled: true

  skybox:
    enabled: true

  strawberry_texture:
    enabled: true

  objects_count:
    enabled: true
    min_fruits: 4
    max_fruits: 8
    max_ripe: 3
    random_count: True

  object_positions:
    enabled: true
    rotation_enabled: true
    yaw_only: true
    rotation_angle_range: [-0.05, 0.05]
    position_range_low: [-0.06, -0.03, -0.02]
    position_range_high: [0.06, 0.03, 0.02]

  object_scale:
    enabled: true
    scale_range: [0.8, 1.2]

